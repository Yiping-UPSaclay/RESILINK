# Agent roles -> model / effort (blueprint §1.6, decision D19). All roles default to claude-opus-5-5;
# a cheaper model for a role is a USER decision taken only after that role's eval shows quality holds.
roles:
  copilot:
    model: claude-opus-5-5
    effort: medium
    prompt: prompts/copilot.md
    autonomy: compute          # A1: may submit experiments within quota; proposals go through specialists
    ops: ["catalog.*", "data.*", "network.*", "hazards.*", "experiments.*", "knowledge.*", "views.*", "findings.propose", "proposals.list"]
    max_iterations: 16
    max_tokens: 16000
  reviewer:
    model: claude-opus-5-5
    effort: high
    prompt: prompts/reviewer.md
    autonomy: read
    ops: ["experiments.metrics", "knowledge.search", "catalog.describe_table"]
    max_iterations: 6
    max_tokens: 8000

# Anthropic first-party list prices, USD per million tokens (checked 2026-11-16; bundled Claude API reference).
# cache_write_5m assumes the standard 1.25x input multiplier (TBC on the pricing page).
prices_usd_per_mtok:
  claude-opus-5-5:   {input: 4.0, output: 20.0, cache_read: 0.20, cache_write_5m: 5.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.10, cache_write_5m: 2.5}
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write_5m: 0.125}

# Server-side refusal fallback on the first-party API (enabled by default; set false to opt out).
server_side_fallbacks: true
