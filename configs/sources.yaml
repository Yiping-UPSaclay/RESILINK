# Source register (blueprint §5.2). Connector paths verified 2026-11-16.
# NOTE: Enedis migrated its portal to Data Fair (the Opendatasoft v2.1 paths now return HTTP 410).
sources:
  - id: rte.postes
    provider: RTE (via ODRÉ)
    connector: opendatasoft
    base_url: https://odre.opendatasoft.com
    dataset: postes-electriques-rte
    format: csv
    territory_mode: none    # national file (5,042 sites); the adapter keeps the départements of the buffer by name
    territory_field: departement
    territory_value: name   # RTE uses département names, not codes
    role: Attributes and completeness denominator for HV substations (NO geometry since 2026-06-16, public safety)
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: semiannual
    id_strategy: native:code_poste
    priority: P0
  - id: rte.lignes_aer
    provider: RTE (via ODRÉ)
    connector: opendatasoft
    base_url: https://odre.opendatasoft.com
    dataset: lignes-aeriennes-rte-nv
    format: csv
    role: Line codes, voltage, circuits (geometry from OSM)
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: semiannual
    id_strategy: native:code_ligne
    priority: P0
  - id: enedis.poste_electrique
    provider: Enedis
    connector: datafair
    base_url: https://opendata.enedis.fr
    dataset: poste-electrique
    territory_mode: extent_bbox
    territory_field: code_departement
    role: MV/LV (HTA/BT) substations
    licence: Licence Ouverte 2.0
    sensitivity: internal
    refresh: semiannual
    id_strategy: fingerprint_point_1m
    priority: P0
  - id: natran.trace250
    provider: NaTran (via ODRÉ)
    connector: opendatasoft
    base_url: https://odre.opendatasoft.com
    dataset: trace-du-reseau-grt-250
    format: parquet               # ODS Parquet exports carry WKB geometry (checked 2026-11-26)
    territory_mode: none          # national file (11,615 segments); the adapter clips to the territory
    vintage: "MAJ 2024 (processed 2025-03-20)"
    role: Gas transmission network (~250 m accuracy; never for works)
    licence: Licence Ouverte 2.0
    sensitivity: internal
    refresh: annual
    id_strategy: fingerprint_line_250m
    priority: P0
    docs_url: https://odre.opendatasoft.com/explore/dataset/trace-du-reseau-grt-250/
  - id: odre.registre_prod
    provider: ODRÉ
    connector: opendatasoft
    base_url: https://odre.opendatasoft.com
    dataset: registre-national-installation-production-stockage-electricite-agrege
    format: csv
    territory_field: codedepartement
    role: Generators (fuel, capacity)
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: monthly
    id_strategy: native (TBC)
    priority: P0
    notes: territory_field name TBC against the dataset schema

  # --- D1 territory and population (verified 2026-11-26) -------------------------------------------------
  # ADMIN EXPRESS COG (full precision, not the generalised CARTO edition) from the IGN Géoplateforme WFS, pinned
  # to the COG 2026 edition (1 Jan 2026). Licence: Licence Ouverte 2.0 (IGN entry on data.gouv.fr: lov2).
  - id: ign.admin_express.departement
    provider: IGN (Géoplateforme WFS)
    connector: wfs
    base_url: https://data.geopf.fr/wfs/ows
    dataset: ADMINEXPRESS-COG.2026:departement
    format: geojson
    territory_mode: buffer_bbox   # the territory's départements and their neighbours in the buffer window
    territory_layer: ADMINEXPRESS-COG.2026:departement
    territory_field: code_insee
    vintage: "COG 2026"
    role: Départements meeting the buffer window; the territory's own ones form the core, the buffer is derived from it
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: annual
    id_strategy: native:code_insee
    priority: P0
    docs_url: https://www.data.gouv.fr/datasets/admin-express-admin-express-cog-admin-express-cog-carto-admin-express-cog-carto-pe-admin-express-cog-carto-plus-pe
  - id: ign.admin_express.commune
    provider: IGN (Géoplateforme WFS)
    connector: wfs
    base_url: https://data.geopf.fr/wfs/ows
    dataset: ADMINEXPRESS-COG.2026:commune
    format: geojson
    territory_mode: buffer_bbox
    territory_layer: ADMINEXPRESS-COG.2026:departement
    territory_field: code_insee
    vintage: "COG 2026"
    role: Communes in the territory and its buffer (codes, names, census population dated 2023-01-01)
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: annual
    id_strategy: native:code_insee
    priority: P0
    notes: The WFS returns communes in the buffered bounding box; the adapter keeps those meeting the buffer itself.
    docs_url: https://www.data.gouv.fr/datasets/admin-express-admin-express-cog-admin-express-cog-carto-admin-express-cog-carto-pe-admin-express-cog-carto-plus-pe
  # INSEE Filosofi 2021, 200 m cells (published 2026-02-12): national zip of three CSVs (metropolitan France,
  # Martinique, La Réunion). Only inhabited cells; values imputed where a cell has fewer than 11 fiscal households
  # (i_est_200 = 1). Cell ids are INSPIRE codes of the cell's south-west corner in EPSG:3035 (checked on all
  # 2,298,582 metropolitan cells against their 1 km parent ids). Licence Ouverte 2.0 ("Source : Insee").
  - id: insee.filosofi2021_200m
    provider: INSEE
    connector: http_file
    base_url: https://www.insee.fr
    dataset: fr/statistiques/fichier/8735162/Filosofi2021_carreaux_200m_csv.zip
    format: zip
    territory_mode: none
    members: [carreaux_200m_met.csv, carreaux_200m_mart.csv, carreaux_200m_reun.csv]
    vintage: "Filosofi 2021 (incomes 2021), published 2026-02-12"
    role: 200 m population lattice (individuals, households, age bands, housing) for exposure and consequences
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: annual
    id_strategy: native:idcar_200m
    priority: P0
    notes: The raw snapshot is the national file byte for byte; the adapter selects the territory's cells.
    docs_url: https://www.insee.fr/fr/statistiques/8735162

  # --- D2 electricity (verified 2026-11-26) -------------------------------------------------------------
  # Enedis medium-voltage (HTA) lines on the Data Fair portal (Licence Ouverte 2.0, data of 2026-07-03): segments
  # with geometry and admin codes only (no voltage, no switch state). Fetched in the territory window (bbox).
  - id: enedis.reseau_hta
    provider: Enedis
    connector: datafair
    base_url: https://opendata.enedis.fr
    dataset: reseau-hta
    territory_mode: extent_bbox
    role: Overhead medium-voltage (HTA) line segments
    licence: Licence Ouverte 2.0
    sensitivity: internal
    refresh: semiannual
    id_strategy: fingerprint_line_1m
    priority: P0
    docs_url: https://opendata.enedis.fr/datasets/reseau-hta
  - id: enedis.reseau_souterrain_hta
    provider: Enedis
    connector: datafair
    base_url: https://opendata.enedis.fr
    dataset: reseau-souterrain-hta
    territory_mode: extent_bbox
    role: Underground medium-voltage (HTA) cable segments
    licence: Licence Ouverte 2.0
    sensitivity: internal
    refresh: semiannual
    id_strategy: fingerprint_line_1m
    priority: P0
    docs_url: https://opendata.enedis.fr/datasets/reseau-souterrain-hta
  # Enedis' own yearly totals per département (verified 2026-11-28): km of HTA lines by type and the number of
  # HTA/BT substations it operates. No geometry, so Data Fair exports it as CSV only. Release QA compares the
  # staged network with them (D6).
  - id: enedis.network_totals
    provider: Enedis
    connector: datafair
    base_url: https://opendata.enedis.fr
    dataset: donnees-relatives-aux-lignes-et-aux-postes
    format: csv
    territory_mode: field
    territory_field: code_departement
    role: Completeness reference for the MV network (km of HTA lines, number of HTA/BT substations per year)
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: annual
    id_strategy: native:code_departement+annee
    priority: P0
    docs_url: https://opendata.enedis.fr/datasets/donnees-relatives-aux-lignes-et-aux-postes
  # OpenStreetMap extracts from Geofabrik (regions as of the former French regions; the buffer of the pilot
  # reaches Gard and Hérault, hence two extracts). The URL redirects to a dated file, recorded in the snapshot,
  # and checked against Geofabrik's .md5. Read with DuckDB spatial ST_ReadOSM (no extra dependency).
  # Licence: ODbL 1.0 - derived tables are share-alike and must credit "© OpenStreetMap contributors".
  - id: osm.geofabrik.paca
    provider: OpenStreetMap contributors (Geofabrik extract)
    connector: http_file
    base_url: https://download.geofabrik.de
    dataset: europe/france/provence-alpes-cote-d-azur/provence-alpes-cote-d-azur-latest.osm.pbf
    format: pbf
    territory_mode: none
    checksum: md5_sidecar
    role: High-voltage lines and substations (geometry; RTE publishes none since 2026-06-16)
    licence: ODbL 1.0
    sensitivity: internal
    refresh: monthly
    id_strategy: native:osm_id
    priority: P0
    docs_url: https://www.openstreetmap.org/copyright
  - id: osm.geofabrik.languedoc_roussillon
    provider: OpenStreetMap contributors (Geofabrik extract)
    connector: http_file
    base_url: https://download.geofabrik.de
    dataset: europe/france/languedoc-roussillon/languedoc-roussillon-latest.osm.pbf
    format: pbf
    territory_mode: none
    checksum: md5_sidecar
    role: High-voltage lines and substations west of the Rhône (Gard, Hérault part of the buffer)
    licence: ODbL 1.0
    sensitivity: internal
    refresh: monthly
    id_strategy: native:osm_id
    priority: P0
    docs_url: https://www.openstreetmap.org/copyright

  # --- D3 telecom (verified 2026-11-26) -----------------------------------------------------------------
  # ARCEP "Mon Réseau Mobile" sites, pinned to the 2026 T2 file (published 2026-09-24; Licence Ouverte, data.gouv
  # fr-lo). One row per operator site (a shared mast appears once per operator). The file departs from its own
  # documentation, and the adapter repairs it explicitly: text mixes UTF-8 and cp1252 within a line; leading zeros
  # are stripped from département, commune and ANFR codes (ANFR ids are 10 characters once zero-padded, the first
  # three giving the département); some x/y use a decimal comma; 950 Orange num_site values were turned into
  # scientific notation by a spreadsheet; 359 rows have no ANFR id. x/y are Lambert-93 (within 1 m of lat/lon).
  - id: arcep.sites
    provider: ARCEP
    connector: http_file
    base_url: https://data.arcep.fr
    dataset: mobile/sites/2026_T2/2026_T2_sites_Metropole.csv
    format: csv
    delimiter: ";"
    territory_mode: none
    vintage: "2026 T2 (published 2026-09-24)"
    role: Mobile network sites (2G-5G) with their ANFR station ids
    licence: Licence Ouverte 2.0
    sensitivity: internal
    refresh: quarterly
    id_strategy: native:id_station_anfr
    priority: P0
    notes: The raw snapshot is the national file byte for byte; the adapter selects the territory's sites.
    docs_url: https://data.arcep.fr/mobile/sites/documentation_sites.md

  # --- D4 gas (verified 2026-11-26) -----------------------------------------------------------------------
  # GRDF distribution network in service (opendata.grdf.fr, same Opendatasoft API; Licence Ouverte): pipe segments
  # with their commune, no pressure or diameter. 224,298 segments in the territory window.
  - id: grdf.network
    provider: GRDF
    connector: opendatasoft
    base_url: https://opendata.grdf.fr
    dataset: cartographie-du-reseau-grdf-en-service
    format: parquet
    territory_mode: extent_bbox
    geo_point_field: geo_point_2d
    role: Gas distribution pipes (where the public gas network reaches)
    licence: Licence Ouverte 2.0
    sensitivity: internal
    refresh: annual
    id_strategy: fingerprint_line_1m
    priority: P0
    docs_url: https://opendata.grdf.fr/explore/dataset/cartographie-du-reseau-grdf-en-service/
  # Gas-fired power stations (ODRÉ, published by NaTran; Licence Ouverte): one row per site and reference year
  # (2019-2025), with coordinates. They couple the gas and electricity networks.
  - id: odre.gas_power_plants
    provider: NaTran (via ODRÉ)
    connector: opendatasoft
    base_url: https://odre.opendatasoft.com
    dataset: prod-elec-gaz-naturel-fr
    format: csv
    territory_mode: none
    role: Gas-fired power stations (gas -> electricity coupling)
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: annual
    id_strategy: native:site
    priority: P0
    docs_url: https://odre.opendatasoft.com/explore/dataset/prod-elec-gaz-naturel-fr/

  # --- D5 flood hazard (verified 2026-11-27) ----------------------------------------------------------------
  # Floods Directive mapping of the TRI (Territoires à Risque important d'Inondation), 2020 reporting, COVADIS DI v2
  # standard (Géorisques, licence etalab-2.0; files static since 2022-01-17). One shapefile archive per département,
  # per TRI: flood extents (inondable_<type>_<scenario>) and water-depth classes (iso_ht_<type>_<scenario>) for
  # types 01 river overflow, 02 runoff, 03 marine submersion and scenarios 01for (frequent, ~10 y), 02moy (medium,
  # ~100 y), 03mcc (medium with climate change), 04fai (rare, ~1000 y). Département 04 has no TRI.
  # Géorisques' WFS serves only national extents without depths, and ignores startIndex (pages repeat; 500 max).
  - &tri2020
    id: georisques.tri2020_13
    provider: Géorisques (DREAL, Floods Directive)
    connector: http_file
    base_url: https://files.georisques.fr
    dataset: di_2020/tri_2020_sig_di_13.zip
    format: zip
    territory_mode: none
    members: ["*_inondable_*_s_*.*", "*_iso_ht_*_s_*.*", "*_tri_s_*.*"]
    vintage: "TRI 2020 reporting (files of 2022-01-17)"
    role: Flood extents and water-depth classes per scenario (frequent, medium, rare)
    licence: Licence Ouverte 2.0
    sensitivity: public
    refresh: manual
    id_strategy: native:id
    priority: P0
    docs_url: https://www.georisques.gouv.fr/donnees/bases-de-donnees/zonages-inondation-rapportage-2020
  - {<<: *tri2020, id: georisques.tri2020_30, dataset: di_2020/tri_2020_sig_di_30.zip}
  - {<<: *tri2020, id: georisques.tri2020_34, dataset: di_2020/tri_2020_sig_di_34.zip}
  - {<<: *tri2020, id: georisques.tri2020_83, dataset: di_2020/tri_2020_sig_di_83.zip}
  - {<<: *tri2020, id: georisques.tri2020_84, dataset: di_2020/tri_2020_sig_di_84.zip}
