# Self-describing data (blueprint §1.5): column semantics and units for agents and humans.
# Served by the `catalog.describe_table` op; used by the ViewSpec validator (layer ids, tiers).
tables:
  nodes:
    tier: internal
    description: >-
      Infrastructure nodes of all layers (canonical, EPSG:2154). Real territories cover the core and its buffer and
      keep only what is connected to a source with no damage (the QA report lists what was dropped).
    columns:
      rid: Stable entity id <layer>.<class>:<ns>:<key> (ns = rte, osm, anfr, odre for native keys; fp for fingerprints).
      k: Dense integer index within the release (used to join result arrays).
      layer: elec | gas | telecom | facility.
      class: Class declared by the layer's system pack (e.g. sub_primary, junction_mv, delivery_station).
      name: Human-readable name (RTE site name, OSM name, ARCEP site number).
      operator: Operator named by the source (empty when unknown).
      status: in_service | planned (RTE sites with an administrative agreement only).
      is_source: True if the node is a supply source of its layer (for real territories also the points where a
        network leaves the buffer, assumptions A-ELEC-02 and A-GAS-04).
      voltage_kv: Nominal voltage (kV), electricity only.
      pos_uncertainty_m: Positional uncertainty (m).
      confidence: Existence/attribute confidence in [0, 1].
      primary_source: Source of the position (osm, enedis.poste_electrique, arcep.sites, rte.postes+osm, derived...).
      sensitivity: public | internal | restricted.
      in_core: True if the node lies in the territory's départements (false in the buffer).
  edges:
    tier: internal
    description: >-
      Intra-layer links (lines, cables, pipelines, logical backhaul). Real lines are open-data segments noded and
      contracted (etl/topology.py): one edge runs between two nodes that are substations, stations, junctions or
      buffer cut points; its geometry is the merged line.
    columns:
      rid: Stable id (fingerprint of class, end points and length; logical links take their site's key).
      src_rid: Endpoint node rid.
      dst_rid: Endpoint node rid.
      length_m: Length in metres.
      aerial_share: Share of the length that is overhead (0-1).
      voltage_kv: Nominal voltage (kV) of HV lines (empty when OSM gives none).
      primary_source: osm, enedis, natran.trace250, or derived (plant connections, station connectors, backhaul).
      in_core: True if the edge meets the territory's départements.
  service_links:
    tier: internal
    description: >-
      Which supplier serves each grid cell, per system (supplier class from the system pack). Real territories:
      nearest MV/LV substation (A-SVC-01); per operator the nearest mobile site, equal shares (A-SVC-02); cells
      crossed by a GRDF natural-gas pipe from the nearest delivery station (A-SVC-03).
    columns:
      cell_id: Grid cell.
      supplier_rid: Node serving the cell.
      sector: System of the supplier (elec | gas | telecom).
      share: Share of the cell's population served through this link.
  entity_xref:
    tier: internal
    description: Source identifiers behind each node (several sources may describe one asset, e.g. RTE and OSM).
    columns:
      rid: Node rid.
      source_id: Source register id (or osm).
      source_key: The asset's id in that source (RTE code, OSM id, Enedis id, ANFR id, plant name).
  grid_cells:
    tier: public
    description: >-
      200 m population lattice. Real territories use INSEE Filosofi 2021 (inhabited cells only; cell in the
      territory when its centre lies in the buffer). Other INSEE variables keep their INSEE names (men, men_pauv,
      log_soc, ind_0_3 ... ind_80p; see https://www.insee.fr/fr/statistiques/8735162).
    columns:
      cell_id: Lattice cell id (INSPIRE code CRS3035RES200mN<y>E<x> of the cell's south-west corner, EPSG:3035).
      k: Dense integer index within the release.
      pop: Individuals in fiscal households (Filosofi `ind`, 2021); excludes people living in communities.
      admin_commune: COG code of the commune containing the cell centre (nearest within 500 m for coastal cells).
      in_core: True if the cell centre lies in the territory's départements (false in the buffer).
      imputed: True when INSEE imputed the cell's values (fewer than 11 fiscal households).
      lcog_geo_2021: INSEE's commune codes for the cell (COG 2021, largest share first; arrondissements for PLM).
  admin_areas:
    tier: public
    description: Départements of the territory and every commune meeting its buffer (IGN ADMIN EXPRESS COG).
    columns:
      admin_id: Stable id admin.<level>:cog<year>:<code>.
      level: departement | commune.
      code: Official geographic code (COG) of the edition in cog_year.
      parent_id: admin_id of the enclosing area.
      cog_year: COG edition of the code and boundary.
      population: Municipal population from the census (départements - sum of their communes).
      census_date: Reference date of the census population.
      in_core: True for areas of the territory's départements, false for buffer-only communes.
      area_km2: Area in km² (Lambert-93).
  territory_extent:
    tier: public
    description: The territory's départements (core) and the core grown by the territory buffer.
    columns:
      extent_id: <territory>:core or <territory>:buffer.
      kind: core | buffer.
      buffer_m: Buffer distance in metres (0 for the core).
  hazard_scenarios:
    tier: public
    description: >-
      Hazard scenarios with return periods. Real territories use the Floods Directive TRI mapping (2020 reporting):
      river and marine flooding at 10, 100 and 1000 years, plus a 100-year scenario with climate change
      (assumption A-HAZ-02).
    columns:
      scenario_id: Scenario id, e.g. tri2020_river_rp100.
      set_id: Scenarios integrated together over return periods (e.g. tri2020_river; climate change is its own set).
      return_period_y: Return period (years).
      annual_rate: 1 / return period.
      im_type: Intensity measure type (e.g. depth_m).
      tris: TRIs contributing footprints to the scenario.
  hazard_footprints:
    tier: public
    description: >-
      Polygons of one intensity band per scenario. For floods, the TRI water-depth classes; flooding outside TRI
      perimeters is not mapped (A-HAZ-03). Polygons of one scenario can overlap: take the maximum depth at a point
      and the union when summing lengths.
    columns:
      scenario_id: Scenario of the polygon.
      band: Depth class, e.g. 0.5-1, 2+ (over 2 m), or unknown.
      im_min: Lower bound of the class (m).
      im_max: Upper bound of the class (m), the intensity used for exposure; 3.0 for "2+" (A-HAZ-01), 0.5 for unknown (A-HAZ-04).
      depth_known: False where the extent had no depth class (A-HAZ-04).
      tri: TRI the polygon belongs to.
  exposure:
    tier: internal
    description: Asset x scenario intensity (the exposure contract).
    columns:
      scenario_id: Scenario id.
      asset_rid: Exposed asset rid.
      im_value: Intensity value (unit per im_type, e.g. metres of water).
      exposed_length_m: For lines, exposed length (m).
  metrics:
    tier: internal
    description: Risk metrics of a run (values with 5/50/95 % epistemic bands where available).
    columns:
      metric: mean_loss | mean_direct_loss | var_95 | cvar_95 | eal | amplification_ratio | mc_rel_se.
      scenario_id: Scenario id, or 'annual' for EAL.
      sector: elec | gas | telecom | all.
      value: Point estimate.
      p05: 5th percentile over the epistemic (outer) loop.
      p50: Median over the epistemic loop.
      p95: 95th percentile over the epistemic loop.
      unit: people-hours, people-hours/year or ratio.
  node_stats:
    tier: restricted
    description: Per-asset failure probability and mean downtime (asset-level vulnerability -> restricted).
    columns:
      rid: Asset rid.
      p_down: Probability the asset is non-functional at some time within the horizon.
      mean_downtime_h: Mean hours non-functional within the horizon.
  cell_stats:
    tier: internal
    description: Per-cell service disruption statistics by sector.
    columns:
      cell_id: Lattice cell id.
      k: Dense cell index.
      sector: elec | gas | telecom.
      p_disruption: Probability that outage exceeds the disruption threshold.
      mean_outage_h: Mean outage hours.
  sample_losses:
    tier: internal
    description: Per-sample losses (people-hours) by sector, total and direct-only.
    columns:
      o: Outer (epistemic) sample index.
      i: Inner (aleatory) sample index.
      loss_total: People-hours lost.
      loss_direct: People-hours lost attributable to directly damaged suppliers.
map_layers:
  infrastructure_nodes: {table: nodes, tier: internal, geometry: point}
  infrastructure_edges: {table: edges, tier: internal, geometry: line}
  population_grid: {table: grid_cells, tier: public, geometry: polygon}
  flood_footprints: {table: hazard_footprints, tier: public, geometry: polygon}
  communes: {table: admin_areas, tier: public, geometry: polygon}
