[project]
name = "resilink"
version = "0.1.0"
description = "RESILINK deterministic core: canonical data model, ETL, multilayer network, cascade, risk, Operation Registry and knowledge store (no UI / LLM dependencies)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17",
    "shapely>=2.1",
    "pyproj>=3.6",
    "geopandas>=1.2",
    "pyogrio>=0.10",
    "duckdb>=2.0,<2.1",
    "networkx>=3.3",
    "pydantic>=2.8",
    "pandera[geopandas]>=0.20",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "SALib>=1.5",
    "packaging>=24.0",
]

[project.scripts]
resilink = "resilink.cli:app"

# Built-in system packs, registered exactly like a pack from a separate package (ADR-0008 §2).
[project.entry-points."resilink.systems"]
elec = "resilink.systems:ELEC"
facility = "resilink.systems:FACILITY"
gas = "resilink.systems:GAS"
telecom = "resilink.systems:TELECOM"

# Built-in slot definitions v0.1 (ADR-0008 §3).
[project.entry-points."resilink.slots"]
consequence = "resilink.slots:CONSEQUENCE"
dependency = "resilink.slots:DEPENDENCY"
fragility = "resilink.slots:FRAGILITY"
hazard = "resilink.slots:HAZARD"
orchestrator = "resilink.slots:ORCHESTRATOR"
propagation = "resilink.slots:PROPAGATION"
restoration = "resilink.slots:RESTORATION"
sampler = "resilink.slots:SAMPLER"
service = "resilink.slots:SERVICE"

# Built-in models, registered exactly like a thesis plugin from a separate package (ADR-0008 §4).
[project.entry-points."resilink.models"]
connectivity = "resilink.service.plugin:connectivity"
episode = "resilink.engine.episode:episode"
flood_footprints = "resilink.hazards.plugin:flood_footprints"
independent_repair = "resilink.restoration.plugin:independent_repair"
lognormal_library = "resilink.fragility.plugin:lognormal_library"
nested_mc = "resilink.engine.sampler:nested_mc"
no_dependencies = "resilink.dependencies.plugin:no_dependencies"
people_hours = "resilink.consequence.plugin:people_hours"
proximity_softmax = "resilink.dependencies.plugin:proximity_softmax"
topological_temporal = "resilink.cascade.plugin:topological_temporal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilink"]
