[project]
name = "resilink"
version = "0.1.0"
description = "RESILINK deterministic core: canonical data model, ETL, multilayer network, cascade, risk, Operation Registry and knowledge store (no UI / LLM dependencies)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17",
    "shapely>=2.1",
    "pyproj>=3.6",
    "geopandas>=1.2",
    "pyogrio>=0.10",
    "duckdb>=2.0,<2.1",
    "networkx>=3.3",
    "pydantic>=2.8",
    "pandera[geopandas]>=0.20",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "SALib>=1.5",
    "packaging>=24.0",
]

[project.scripts]
resilink = "resilink.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilink"]
