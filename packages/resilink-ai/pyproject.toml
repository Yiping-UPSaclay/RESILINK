[project]
name = "resilink-ai"
version = "0.1.0"
description = "RESILINK AI layer: gateway (tier routing, models, caching, fallbacks, budgets, provenance), agent roles, grounding checker, ViewSpec."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "resilink",
    "anthropic>=1.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vertex = ["anthropic[vertex]>=1.0"]

[tool.uv.sources]
resilink = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilink_ai"]
