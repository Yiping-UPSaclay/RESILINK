      string: "# Sites fournissant un service mobile\r\n---\r\n\r\n## :bar_chart:
        Pr\xE9sentation des donn\xE9es\r\n\r\nLes \"**sites**\" d\xE9signent les \xE9quipements,
        g\xE9n\xE9ralement plac\xE9s sur des points hauts, n\xE9cessaires \xE0 la
        transmission radio des r\xE9seaux mobiles. Un site comporte d'ordinaire plusieurs
        antennes et peut comporter plusieurs technologies (2G, 3G, 4G, 5G). Certains
        sites sont partag\xE9s entre plusieurs op\xE9rateurs : on dit alors que le
        site est \"mutualis\xE9\".\r\n\r\nLes donn\xE9es sont collect\xE9es tous les
        trimestres par l'Arcep aupr\xE8s des op\xE9rateurs.\r\n\r\n## :notebook: Descriptif
        des donn\xE9es\r\n\r\n### :tokyo_tower: Fichiers : Sites\r\n\r\nListe des
        sites 2G/3G/4G/5G ouverts commercialement en France, dont la puissance isotrope
        rayonn\xE9e \xE9quivalente (PIRE) est sup\xE9rieure \xE0 5W.\r\n\r\nLe reporting
        mensuel 5G n'est plus publi\xE9 depuis juillet 2021 : il est possible de reconstituer
        la liste des sites 5G \xE0 date \xE0 partir des informations disponibles dans
        ce fichier sites g\xE9n\xE9ral.\r\n\r\nLes listes de sites sont ventil\xE9es
        par zone \xE0 partir du mill\xE9sime **2022 T3** (voir ci-dessous pour les
        anciens mill\xE9simes) :\r\n- les sites localis\xE9s en France m\xE9tropolitaine
        (ex : `2022_T3_sites_Metropole.csv`)\r\n- les sites localis\xE9s en France
        d'outre-mer (ex : `2022_T3_sites_Outremer.csv`)\r\n\r\n**Caract\xE9ristiques
        g\xE9n\xE9rales :**\r\n\r\n|||\r\n| ----------------- | --------------|\r\n|
        Format\t \t\t| csv\t\t\t|\r\n| S\xE9parateur\t \t| ;\t\t\t\t|\r\n| D\xE9cimale\t\t
        \t| ,\t\t\t\t|\r\n| Encodage\t \t\t| UTF-8 \t\t|\r\n| Type de g\xE9om\xE9trie\t|
        point (x;y)\t|\r\n| Syst\xE8me de coordonn\xE9es g\xE9ographiques | projection
        en vigueur pour chaque territoire (voir ci-dessous [cl\xE9s de lecture](#\U0001F5DD-cl\xE9s-de-lecture-des-donn\xE9es))|\r\n|
        Source\t\t\t| op\xE9rateurs \t|\r\n\r\n*Pour afficher les fichiers csv avec
        les bons accents dans le logiciel Microsoft Excel, il est possible d\u2019ex\xE9cuter
        l\u2019Assistant importation de texte en rempla\xE7ant l\u2019extension de
        nom de fichier `.csv` par `.txt` avant de l\u2019ouvrir. Vous pourrez alors
        s\xE9lectionner l\u2019encodage UTF-8.*\r\n\r\n**Description des champs :**\r\n\r\n|
        Nom des\t\t\t\t\t\t\t| Description des champs\t\t\t\t\t\t\t\t\t\t| Format\t\t\t\t\t|\r\n|
        --------------------------------- | -------------------------------------------------------------
        | --------------------------|\r\n| `code_op`\t\t\t\t\t\t\t| Code de l'op\xE9rateur\t\t\t\t\t\t\t\t\t\t\t|
        Entier  (5 chiffres)\t\t|\r\n| `nom_op`\t\t\t\t\t\t\t| Nom commercial de l'op\xE9rateur\t\t\t\t\t\t\t\t\t|
        Texte\t\t\t\t\t\t|\r\n| `num_site`\t\t\t\t\t\t| Identifiant du site issu du
        SI de l'op\xE9rateur\t\t\t\t\t| Texte\t\t\t\t\t\t|\r\n| `id_site_partage`*\t\t\t\t|
        Identifiant du site mutualis\xE9 entre op\xE9rateurs\t\t\t\t| Texte\t\t\t\t\t\t|\r\n|
        `id_station_anfr`\t\t\t\t\t| Identifiant de station ANFR (Agence Nationale
        des Fr\xE9quences)\t| Texte (10 caract\xE8res)\t\t|\r\n| `x`\t\t\t\t\t\t\t\t|
        Coordonn\xE9e x dans le syst\xE8me de projection en vigueur\t\t\t| Entier\t\t\t\t\t|\r\n|
        `y`\t\t\t\t\t\t\t\t| Coordonn\xE9e y dans le syst\xE8me de projection en vigueur\t\t\t|
        Entier\t\t\t\t\t|\r\n| `latitude`\t\t\t\t\t\t| Latitude en projection WGS
        1984 (EPSG:4326)\t\t\t\t\t| R\xE9el\t\t\t\t\t\t|\r\n| `longitude`\t\t\t\t\t\t|
        Longitude en projection WGS 1984 (EPSG:4326)\t\t\t\t\t| R\xE9el\t\t\t\t\t\t|\r\n|
        `nom_reg`\t\t\t\t\t\t\t| Nom de la r\xE9gion d'implantation du site (Code
        Officiel G\xE9ographique de l'ann\xE9e courante)\t\t\t| Texte\t|\r\n| `nom_dep`\t\t\t\t\t\t\t|
        Nom du d\xE9partement d'implantation du site (Code Officiel G\xE9ographique
        de l'ann\xE9e courante)\t\t| Texte\t|\r\n| `insee_dep`\t\t\t\t\t\t| Code du
        d\xE9partement d'implantation du site (Code Officiel G\xE9ographique de l'ann\xE9e
        courante)\t\t| Texte\t|\r\n| `nom_com`\t\t\t\t\t\t\t| Nom de la commune d'implantation
        du site (Code Officiel G\xE9ographique de l'ann\xE9e courante)\t\t\t| Texte\t|\r\n|
        `insee_com`\t\t\t\t\t\t| Code Insee de la commune d'implantation du site (Code
        Officiel G\xE9ographique de l'ann\xE9e courante)\t| Texte\t|\r\n| `site_2g`\t\t\t\t\t\t\t|
        Equipement du site en technologie 2G\t\t\t\t\t\t\t| Bool\xE9en (0 = FAUX 1=VRAI)
        |\r\n| `site_3g`\t\t\t\t\t\t\t| Equipement du site en technologie 3G\t\t\t\t
        \t\t\t| Bool\xE9en (0 = FAUX 1=VRAI) |\r\n| `site_4g`\t\t\t\t\t\t\t| Equipement
        du site en technologie 4G\t\t\t\t \t\t\t| Bool\xE9en (0 = FAUX 1=VRAI) |\r\n|
        `site_5g`\t\t\t\t\t\t\t| Equipement du site en technologie 5G\t\t\t\t \t\t\t|
        Bool\xE9en (0 = FAUX 1=VRAI) |\r\n| `mes_4g_trim`*\t\t\t\t\t| Equipement du
        site en technologie 4g au cours du dernier trimestre (du 30/06/2022 au 30/09/2022)
        \t| Bool\xE9en (0 = FAUX 1=VRAI) |\r\n| `site_zb`*\t\t\t\t\t\t| Site issu
        du programme \"zones blanches \u2013 centres-bourgs\"\t\t| Bool\xE9en (0 =
        FAUX 1=VRAI) |\r\n| `site_dcc`*\t\t\t\t\t\t| Site issu du \"Dispositif de
        Couverture Cibl\xE9e\"\t\t\t\t| Bool\xE9en (0 = FAUX 1=VRAI) |\r\n| `site_strategique`*\t\t\t\t|
        Site issu du programme \"France Mobile\"\t\t\t\t\t\t| Bool\xE9en (0 = FAUX
        1=VRAI) |\r\n| `site_capa_240mbps`*\t\t\t\t| Site dont la capacit\xE9 maximum
        th\xE9orique est sup\xE9rieure ou \xE9gale \xE0 240 Mbs\t\t\t\t\t\t\t| Bool\xE9en
        (0 = FAUX 1=VRAI)\t|\r\n| `date_ouverturecommerciale_5g`\t| Date de la premi\xE8re
        ouverture commerciale de la 5G sur le site\t\t \t\t\t\t\t\t\t| Date (\"aaaa-mm-jj\")\t\t|\r\n|
        `site_5g_700_m_hz`\t\t\t\t| Site 5G sur la bande de fr\xE9quences 700 Mhz\t\t\t\t\t|
        Bool\xE9en (0 = FAUX 1=VRAI) |\r\n| `site_5g_800_m_hz`\t\t\t\t| Site 5G sur
        la bande de fr\xE9quences 800 Mhz\t\t\t\t\t| Bool\xE9en (0 = FAUX 1=VRAI)
        |\r\n| `site_5g_1800_m_hz`\t\t\t\t| Site 5G sur la bande de fr\xE9quences
        1800 Mhz\t\t\t\t\t| Bool\xE9en (0 = FAUX 1=VRAI) |\r\n| `site_5g_2100_m_hz`\t\t\t\t|
        Site 5G sur la bande de fr\xE9quences 2100 Mhz\t\t\t\t\t| Bool\xE9en (0 =
        FAUX 1=VRAI) |\r\n| `site_5g_3500_m_hz`\t\t\t\t| Site 5G sur la bande de fr\xE9quences
        3500 Mhz\t\t\t\t\t| Bool\xE9en (0 = FAUX 1=VRAI) |\r\n\r\n&ast; Ces 6 champs
        ne sont pr\xE9sents que dans le fichier des sites de France m\xE9tropolitaine
        et non dans le fichier des sites d'outre-mer.\r\n\r\n**Emprise :**\r\n\r\nFrance
        m\xE9tropolitaine et d'outre-mer.\r\n\r\n**Anciens fichiers sites :**\r\n\r\nCes
        fichiers de sites datant des mill\xE9simes **2022 T2** et ant\xE9rieurs \xE9taient
        divis\xE9s en deux sous-ensembles :\r\n- les sites en France m\xE9tropolitaine
        : un fichier par trimestre pour l'ensemble du territoire m\xE9tropolitain\r\n-
        les sites pour les d\xE9partements et collectivit\xE9s d'outre-mer : un fichier
        par trimestre et par territoire - Guadeloupe (971), Martinique (972), Guyane
        (973), R\xE9union (974), Mayotte (976), Saint-Barth\xE9l\xE9my (977) et Saint-Martin
        (978)\r\n\r\nEn fonction du mill\xE9sime et de la zone donn\xE9e, il est possible
        que tous les champs ci-dessus ne soient pas syst\xE9matiquement renseign\xE9s.\r\n\r\nLes
        sites situ\xE9s dans les Outre-mers ont commenc\xE9 a \xEAtre r\xE9f\xE9renc\xE9s
        \xE0 partir du 4\xE8me trimestre (T4) 2018 \xE0 l'exception de Saint-Martin
        et Saint-Barth\xE9lemy r\xE9f\xE9renc\xE9s \xE0 partir du 1er trimestre (T1)
        2019.\r\n\r\n\r\n### :five: Fichier : Historique du comptage de sites 5G\r\n\r\nTableau
        de comptage du nombre de sites 5G ouverts commercialement par op\xE9rateur
        :\r\n- au dernier jour de chaque mois entre le 30/11/2020 et le 30/06/2021\r\n-
        puis au dernier jour de chaque trimestre \xE0 partir du 30/09/2021\r\n\r\nSites
        localis\xE9s en France m\xE9tropolitaine et France d'outre-mer dont la puissance
        isotrope rayonn\xE9e \xE9quivalente (PIRE) est sup\xE9rieure \xE0 5W.\r\n\r\nLes
        donn\xE9es de comptage de sites 5G sont distribu\xE9es dans un fichier g\xE9n\xE9ral
        par trimestre (ex : `2022_T3_sites_5G_historique_comptage.csv`).\r\n\r\n\r\n**Caract\xE9ristiques
        g\xE9n\xE9rales :**\r\n\r\n|||\r\n| ----------------- | -----------------------------------------------------------------
        |\r\n| Format\t \t\t| csv \t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t|\r\n| S\xE9parateur\t
        \t| ,\t\t\t\t\t\t\t \t\t\t\t\t\t\t\t\t\t|\r\n| D\xE9cimale\t\t \t| .\t\t\t\t\t\t\t
        \t\t\t\t\t\t\t\t\t\t|\r\n| Encodage\t \t\t| UTF-8 \t\t\t\t\t\t\t\t\t\t\t\t\t\t\t|\r\n|
        Source\t\t\t| op\xE9rateurs \t\t\t\t\t\t\t\t\t\t\t\t        |\r\n\r\n\r\n**Description
        des champs :**\r\n\r\n\r\n| Nom des champs\t\t\t\t\t| Description des champs\t\t\t|
        Format\t\t\t\t|\r\n| --------------------------------- | ----------------------------------|----------------------
        |\r\n| `NIVGEO`\t\t\t\t\t\t\t| Niveau g\xE9ographique \t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t|
        Texte\t\t\t\t\t|\r\n| `CODGEO`\t\t\t\t\t\t\t| Code de l'entit\xE9 g\xE9ographique
        (Code Officiel G\xE9ographique de l'ann\xE9e courante)\t| Texte\t\t\t\t\t|\r\n|
        `LIBGEO`\t\t\t\t\t\t\t| Libell\xE9 de l'entit\xE9 g\xE9ographique (Code Officiel
        G\xE9ographique de l'ann\xE9e courante)\t| Texte\t\t\t\t\t|\r\n| `nom_operateur`\t\t\t\t\t|
        Nom commercial de l'op\xE9rateur\t\t\t\t\t\t\t\t\t\t\t\t\t\t| Texte\t\t\t\t\t|\r\n|
        `date`\t\t\t\t\t\t\t| Date du comptage\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t|
        Date (\"aaaa-mm-jj\")\t|\r\n| `nb_sites5G_freq_700_MHz`\t\t    | Nombre de
        sites 5G \xE9quip\xE9s sur les bandes de fr\xE9quences 700 MhZ\t\t        \t|
        Entier\t\t\t\t|\r\n| `nb_sites5G_freq_1800_MHz`        | Nombre de sites 5G
        \xE9quip\xE9s sur les bandes de fr\xE9quences 1800 MhZ\t        \t\t| Entier\t\t\t\t|\r\n|
        `nb_sites5G_freq_3500_MHz`\t\t| Nombre de sites 5G \xE9quip\xE9s sur les bandes
        de fr\xE9quences 3500 MhZ\t\t\t\t\t| Entier\t\t\t\t|\r\n| `nb_sites5G_total`\t\t\t\t|
        Nombre de sites 5G total *\t\t\t\t\t\t\t\t\t\t\t\t\t\t| Entier\t\t\t\t|\r\n\r\n&ast;
        Un m\xEAme site pouvant \xEAtre \xE9quip\xE9 sur plusieurs bandes de fr\xE9quences
        diff\xE9rentes, le nombre de sites total peut \xEAtre inf\xE9rieur \xE0 la
        somme du nombre de sites sur les trois bandes de fr\xE9quences.\r\n\r\n**Jusqu'au
        2025 T4**, les colonnes nb_sites5G_* \xE9taient les suivantes - en l'absence
        de d\xE9ploiement de la technologie dans les bandes 1800 et 800 par les op\xE9rateurs,
        leur mention a \xE9t\xE9 supprim\xE9e :\r\n\r\n| `nb_sites5G_freq_700_800_MHz`\t\t|
        Nombre de sites 5G \xE9quip\xE9s sur les bandes de fr\xE9quences 700 ou 800
        MhZ\t\t\t| Entier\t\t\t\t|\r\n| `nb_sites5G_freq_1800_2100_MHz`\t| Nombre
        de sites 5G \xE9quip\xE9s sur les bandes de fr\xE9quences 1800 ou 2100 MhZ\t\t\t|
        Entier\t\t\t\t|\r\n| `nb_sites5G_freq_3500_MHz`\t\t| Nombre de sites 5G \xE9quip\xE9s
        sur les bandes de fr\xE9quences 3500 MhZ\t\t\t\t\t| Entier\t\t\t\t|\r\n| `nb_sites5G_total`\t\t\t\t|
        Nombre de sites 5G total *\t\t\t\t\t\t\t\t\t\t\t\t\t\t| Entier\t\t\t\t|\r\n\r\n\r\n###
