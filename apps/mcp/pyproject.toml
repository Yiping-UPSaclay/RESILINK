[project]
name = "resilink-mcp"
version = "0.1.0"
description = "MCP server projection of the RESILINK Operation Registry (stdio in P0; Streamable HTTP + OAuth in P3)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "resilink",
    "mcp>=1.10",
]

[project.scripts]
resilink-mcp = "resilink_mcp.server:main"

[tool.uv.sources]
resilink = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilink_mcp"]
