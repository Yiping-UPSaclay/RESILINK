# Assumption register (curated, git-approved). Code, configs and docs cite these IDs.
# grade: A = evidence-backed & validated, B = evidence-backed, C = engineering placeholder.
version: "1.0.0"
assumptions:
  - id: A-DEP-03
    title: Proximity kernel for supplier assignment
    statement: Each dependent draws one supplier among its k nearest compatible candidates with probability proportional to exp(-distance / lambda).
    rationale: Open data has no feeder-to-site connection records; distance is the most transparent proxy.
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-TEL-01
    title: Mobile site battery autonomy
    statement: Backup autonomy of mobile sites ~ gamma(mean 2 h, cv 0.5), scaled by the experiment's backup_scale prior.
    rationale: Placeholder pending evidence extraction from ARCEP / operator / post-event reports (Evidence Curator).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-TEL-02
    title: Exchange backup autonomy
    statement: Core telecom exchanges have batteries plus generators, autonomy ~ gamma(mean 8 h, cv 0.3).
    rationale: Placeholder.
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-TEL-03
    title: Aggregation equipment autonomy
    statement: Aggregation / backhaul equipment autonomy ~ gamma(mean 4 h, cv 0.5).
    rationale: Placeholder.
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-GAS-01
    title: Compressor electric drive
    statement: A transmission compressor depends on grid power with probability 0.5 (electric vs gas-turbine drive unknown).
    rationale: Drive type is not published in open data.
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-GAS-02
    title: LNG terminal power dependency
    statement: LNG send-out depends on a primary substation; emergency generation ~1 h.
    rationale: Placeholder.
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-ELEC-01
    title: Gas-fired generation fuel dependency
    statement: A gas-fired generator trips 0.5 h after its delivery station becomes non-functional (line pack).
    rationale: Placeholder.
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-FRAG-01
    title: Flood fragility library v1
    statement: All flood fragility curves in configs/fragility/v1.yaml (A-FRAG-01..13) are grade-C engineering placeholders.
    rationale: To be replaced by evidence-backed curves (damage functions literature, operator thresholds).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-REP-01
    title: Repair times
    statement: Repair durations ~ lognormal(median by asset class, sigma 0.5), independent across assets; no crew constraints.
    rationale: Restoration scheduling is deferred to Phase 4.
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-TOPO-01
    title: Meshed-optimistic topology
    statement: Any physical path to a functional source restores service instantly (switching assumed instant, ties closed).
    rationale: Open data has no switch states; radial_nearest_source mode is planned as the pessimistic bound.
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-RISK-01
    title: EAL integration convention
    statement: EAL = trapezoid over AEP between scenarios plus a flat tail AEP_min * L_rarest; no loss for events more frequent than the most frequent scenario.
    rationale: Transparent and conservative on the tail; documented in resilink.risk.metrics.
    grade: B
    sensitivity: false
    evidence_ids: []
  - id: A-LOSS-01
    title: Service loss metric
    statement: Loss = people-hours without service per sector = sum over 200 m cells of population x outage hours (supply shares weighted).
    rationale: Directly interpretable; monetisation (value of lost load) deferred.
    grade: B
    sensitivity: false
    evidence_ids: []
  - id: A-POP-01
    title: Population on the 200 m grid
    statement: The population that loses service is INSEE Filosofi 2021 individuals in fiscal households on inhabited 200 m cells. People living in communities (care homes, student halls, barracks, prisons) are not on the grid; in Bouches-du-Rhône the grid holds 0.918 of the census municipal population (measured 2026-11-26).
    rationale: Filosofi is the only open population grid at 200 m. The gap is reported in every staged grid (QA pop_core_vs_census); communities can later enter as facility nodes (e.g. FINESS care homes).
    grade: B
    sensitivity: false
    evidence_ids: []
  - id: A-GAS-03
    title: Gas stations from OpenStreetMap
    statement: Gas stations mapped in OpenStreetMap (pipeline=substation with substance gas, or a gas operator) stand for NaTran's delivery, interconnection and compression stations, which NaTran does not publish. In Bouches-du-Rhône, 87 stations, 1 compression and 1 transmission station are mapped (2026-11-26); completeness is unknown.
    rationale: The only open, located source of gas stations. Their count is reported in every staged table (QA) and can be checked against operator data when available (OPX).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-HAZ-01
    title: Depth of the open "over 2 m" class
    statement: In the TRI water-depth classes, the open class "over 2 m" (ht_max coded 9999) is given a depth of 3.0 m.
    rationale: The flood model needs a finite intensity; most fragility curves are near saturation above 2 m, so the choice matters little for assets but should be tested in sensitivity runs. 17 % of depth polygons in the Bouches-du-Rhône buffer are in this class (2026-11-27).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-HAZ-02
    title: Return periods of the Floods Directive scenarios
    statement: The TRI scenarios are given the return periods named in Géorisques' layer titles - frequent 10 years, medium 100 years, rare 1000 years; the medium scenario with climate change is a separate set at 100 years.
    rationale: The Floods Directive defines ranges (frequent 10-30 y, medium 100-300 y, rare about 1000 y); the titles' single values are the convention. Expected annual loss depends on this choice.
    grade: B
    sensitivity: true
    evidence_ids: []
  - id: A-HAZ-03
    title: No flooding outside TRI perimeters
    statement: Flooding is modelled only inside the mapped TRI extents; elsewhere the flood intensity is zero.
    rationale: TRIs are the territories with mapped flood scenarios and depths; they cover 53 % of Bouches-du-Rhône and 30 % of its 30 km buffer (2026-11-27). Flood risk outside them (AZI atlases, PPRI) is underestimated until those layers are added.
    grade: C
    sensitivity: false
    evidence_ids: []
  - id: A-HAZ-04
    title: Flooded areas without a depth class
    statement: Where a scenario's flood extent has no water-depth class (depth classes covering less than 95 % of the extent), the uncovered part gets the lowest class bound, 0.5 m, flagged depth_known = false.
    rationale: A lower bound that keeps the extent consistent across scenarios. In the Bouches-du-Rhône buffer this concerns the Avignon TRI, medium scenario (234 km2, 2026-11-27).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-ELEC-02
    title: The grid beyond the territory buffer
    statement: Where a high-voltage line leaves the 30 km territory buffer, the cut point is a source of unlimited capacity (the national grid continues there). Gas-fired plants inside the buffer are sources too; other generation is not modelled.
    rationale: The meshed transmission grid is fed from far outside any territory. With the buffer, losing a substation of the territory never cuts the grid at the buffer's edge; 37 cut points in Bouches-du-Rhône (2026-11-28).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-ELEC-03
    title: Enedis substation positions outnumber the substations Enedis operates
    statement: Enedis' position file holds 19,585 HTA/BT substations in Bouches-du-Rhône, while its own yearly totals report 15,589 operated in 2025 (x1.26). The extra points cannot be told apart (presumably customer-owned HTA substations); all are MV/LV substations that may supply the grid.
    rationale: Measured 2026-11-28 against the enedis.network_totals source. The MV network itself agrees with Enedis' total (10,015 of 10,502 km, 95.4 %). Service links to a customer substation misplace a cell's supplier by a few hundred metres at most.
    grade: C
    sensitivity: false
    evidence_ids: []
  - id: A-ELEC-04
    title: Primary substations from the medium-voltage network
    statement: A high-voltage substation (OpenStreetMap, not a railway, industrial or plant substation) is a primary substation (poste source) when at least 3 medium-voltage line ends lie within 150 m of its footprint.
    rationale: Neither Enedis nor RTE publishes the list of primary substations with positions. In Bouches-du-Rhône and its buffer, 131 substations qualify, with a median of 17 feeders each (2026-11-28).
    grade: B
    sensitivity: false
    evidence_ids: []
  - id: A-GAS-04
    title: The gas network beyond the territory buffer
    statement: Where NaTran's transmission trace leaves the 30 km territory buffer, the cut point is a source of unlimited capacity; the two Fos LNG terminals are sources too.
    rationale: The national transmission network is supplied by many entry points and storage outside the territory; 8 cut points in Bouches-du-Rhône (2026-11-28).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-TEL-04
    title: Backhaul to the nearest exchange
    statement: Each mobile site depends on its nearest telecom exchange (OpenStreetMap, any operator) through a logical backhaul link; exchanges are the sources of the mobile system.
    rationale: Open data describes no backhaul (fibre or microwave). Nearest-exchange is the usual proxy in open-data studies; in Bouches-du-Rhône the median site is 1.5 km from an exchange, 99 % within 12 km (2026-11-28).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-SVC-01
    title: Electricity supply of a grid cell
    statement: Each inhabited 200 m cell is supplied by the MV/LV substation nearest to its centre (share 1).
    rationale: Low-voltage feeders are not in open data. Median distance 161 m, 99 % within 642 m in Bouches-du-Rhône (2026-11-28).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-SVC-02
    title: Mobile service of a grid cell
    statement: For each operator, a cell is served by that operator's nearest mobile site within 15 km; each operator carries an equal share of the cell's population.
    rationale: Radio coverage and subscriber shares are not modelled yet; the four operators have national shares of the same order. Median distance about 1 km (2026-11-28).
    grade: C
    sensitivity: true
    evidence_ids: []
  - id: A-SVC-03
    title: Gas supply of a grid cell
    statement: A cell has gas service when a GRDF natural-gas distribution pipe crosses it (propane networks excluded); it is supplied from the nearest delivery station of the transmission network.
    rationale: Which delivery station feeds which distribution network is not published. 10,521 cells holding 80 % of the core population qualify (2026-11-28); not every household of those cells uses gas, so gas losses are an upper bound.
    grade: C
    sensitivity: true
    evidence_ids: []
